# GWML corridor: Reading to London Paddington.
#
# Roles:
#   station   - passenger station on the corridor (resolved by CRS code)
#   junction  - non-station location (junction / timing point); TIPLOCs must be
#               listed by hand after reviewing `rdp corridor resolve` candidates
#   entry     - boundary where trains enter the modelled graph (e.g. Heathrow)
#   exit      - boundary where trains leave the graph (e.g. Paddington low level)
#
# `exclude_tiplocs` removes TIPLOCs that share a CRS but are not part of the
# node (e.g. sidings). Ordering of the London approach (Old Oak Common to
# Paddington) is provisional and will be checked against real CIF and TRUST
# location sequences.
version: 1

nodes:
  - {id: RDG, name: Reading, role: station, crs: RDG}
  - {id: TWY, name: Twyford, role: station, crs: TWY, notes: Henley branch junction}
  - {id: MAI, name: Maidenhead, role: station, crs: MAI, notes: Marlow branch junction}
  - {id: TAP, name: Taplow, role: station, crs: TAP}
  - {id: BNM, name: Burnham, role: station, crs: BNM}
  - {id: SLO, name: Slough, role: station, crs: SLO, notes: Windsor branch junction}
  - {id: LNY, name: Langley, role: station, crs: LNY}
  - {id: IVR, name: Iver, role: station, crs: IVR}
  - {id: WDT, name: West Drayton, role: station, crs: WDT, notes: Colnbrook freight branch}
  - id: AIRPORT_JN
    name: Airport Junction
    role: junction
    tiplocs: [HTRWAJN]
    search: [AIRPORT JN, AIRPORT JUNCTION]
    notes: >-
      Heathrow branch diverges; Heathrow Express shares track east of here.
      Stockley Jn (STKYJN) and Stockley Bridge Jn (STKYBJN) are nearby; add
      them if TRUST reports there rather than at HTRWAJN.
  - {id: HAY, name: Hayes & Harlington, role: station, crs: HAY}
  - {id: STL, name: Southall, role: station, crs: STL, notes: Brentford freight branch}
  - {id: HAN, name: Hanwell, role: station, crs: HAN}
  - {id: WEA, name: West Ealing, role: station, crs: WEA, notes: Greenford branch}
  - {id: EAL, name: Ealing Broadway, role: station, crs: EAL}
  - {id: AML, name: Acton Main Line, role: station, crs: AML, notes: Acton yard / freight}
  - id: OLD_OAK
    name: Old Oak Common
    role: junction
    tiplocs: [OLDOKCW, OLDOKCE]
    search: [OLD OAK]
    notes: Main-line timing points only; depot and siding TIPLOCs excluded
  - id: LADBROKE_GROVE
    name: Ladbroke Grove
    role: junction
    tiplocs: [LDBRKJ]
    search: [LADBROKE]
    notes: >-
      Stands in for Westbourne Park, which has no running-line timing point
      in CORPUS (only GBRF and carriage-siding TIPLOCs)
  - id: PORTOBELLO_JN
    name: Portobello Junction
    role: junction
    tiplocs: [PRTOBJP]
    search: [PORTOBELLO]
    notes: Elizabeth line tracks leave the GWML towards the Royal Oak portal
  - id: PAD
    name: London Paddington (high level)
    role: station
    crs: PAD
    notes: >-
      CORPUS 2026-11-20: PADTON and LINKLIN (Link Line) share STANOX 73000.
      The Elizabeth line low level has its own CRS (PDX), see PAD_LL.
  - id: PAD_LL
    name: London Paddington (Elizabeth line, low level)
    role: exit
    tiplocs: [PADTLL]
    search: [PADDINGTON]
    notes: CORPUS desc "PADDINGTON CROSSRAIL", CRS PDX
  - id: HXX
    name: Heathrow Terminals 2 & 3
    role: entry
    crs: HXX
    notes: Heathrow branch entry; T4 (HAF) and T5 (HWV) are outside the graph

main_line: [RDG, TWY, MAI, TAP, BNM, SLO, LNY, IVR, WDT, AIRPORT_JN, HAY, STL, HAN, WEA, EAL,
            AML, OLD_OAK, LADBROKE_GROVE, PORTOBELLO_JN, PAD]

branches:
  heathrow: [HXX, AIRPORT_JN]
  elizabeth_core: [PORTOBELLO_JN, PAD_LL]
