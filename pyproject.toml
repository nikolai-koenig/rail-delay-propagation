[project]
name = "rail-delay-propagation"
version = "0.1.0"
description = "Modelling how delays propagate on the Great Western Main Line (Reading to Paddington)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "stomp-py>=8.1",
]

[project.scripts]
rdp = "rdp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdp"]

[tool.uv]
# Resolve only package versions published at least two weeks before this date,
# so the lockfile is reproducible and avoids very fresh releases.
exclude-newer = "2026-11-12T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
